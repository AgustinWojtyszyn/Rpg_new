name: Validate Godot project

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Parse and import project
        run: ./godot --headless --path . --editor --quit

      - name: Run deterministic core tests
        run: ./godot --headless --path . --script res://tests/run_all.gd

      - name: Boot dungeon run
        run: |
          ./godot --headless --path . --scene res://scenes/dungeon/dungeon_run.tscn --quit-after 180 --log-file ci-dungeon.log
          if grep -E "SCRIPT ERROR|Parse Error" ci-dungeon.log; then
            cat ci-dungeon.log
            exit 1
          fi

      - name: Boot T-Rex encounter
        run: |
          ./godot --headless --path . --scene res://scenes/bosses/trex_arena.tscn --quit-after 180 --log-file ci-trex.log
          if grep -E "SCRIPT ERROR|Parse Error" ci-trex.log; then
            cat ci-trex.log
            exit 1
          fi

      - name: Boot dimensional boss encounter
        run: |
          ./godot --headless --path . --scene res://scenes/bosses/dimensional_boss_encounter.tscn --quit-after 180 --log-file ci-rift.log
          if grep -E "SCRIPT ERROR|Parse Error" ci-rift.log; then
            cat ci-rift.log
            exit 1
          fi
